<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f9f78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LocalChat">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>ورود به گفت‌وگوی محلی</title>
  <link rel="stylesheet" href="/static/remote.css">
</head>
<body class="remote-page">
  <main class="remote-card">
    <div class="remote-logo" aria-hidden="true">⚡</div>
    <h1>اتصال به رایانهٔ شما</h1>
    <p>کد جفت‌سازی را وارد کنید. این کد را فقط روی رایانه، در صفحهٔ «گوشی» (آدرس <span dir="ltr">127.0.0.1:8000/phone</span>) می‌بینید. فقط یک بار لازم است.</p>
    <form id="loginForm" autocomplete="off">
      <input class="remote-input" id="code" name="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="20" placeholder="XXXX-XXXX-XXXX" aria-label="کد جفت‌سازی" required>
      <input class="remote-input plain gap" id="deviceName" name="name" maxlength="40" placeholder="نام این دستگاه (اختیاری)" aria-label="نام دستگاه">
      <button class="remote-btn" id="submit" type="submit">ورود</button>
      <p class="remote-error" id="error" role="alert"></p>
    </form>
  </main>
  <script src="/static/remote_login.js" defer></script>
</body>
</html>
